; DefaultEngine.ini — 引擎配置
; 多人联机设置

[/Script/Engine.GameEngine]
+NetDriverDefinitions=(DefName="GameNetDriver",DriverClassName="OnlineSubsystemUtils.IpNetDriver",DriverClassNameFallback="OnlineSubsystemUtils.IpNetDriver")

[/Script/OnlineSubsystemUtils.IpNetDriver]
NetServerMaxTickRate=60
MaxNetTickRate=60
MaxClientRate=60000
MaxInternetClientRate=60000

[/Script/Engine.Player]
ConfiguredInternetSpeed=60000
ConfiguredLanSpeed=60000

[/Script/OnlineSubsystemUtils.IpConnection]
ReconnectTimeout=60.0
InitialConnectTimeout=120.0

[/Script/Engine.WorldSettings]
TimeDilation=1.0

; 导航网格设置，确保AI能正常寻路
[/Script/NavigationSystem.NavigationSystemV1]
DefaultAgentRadius=34.0
DefaultAgentHeight=144.0

; 启用Enhanced Input
[/Script/EnhancedInput.EnhancedInputDeveloperSettings]
bEnableWorldSubsystem=True
